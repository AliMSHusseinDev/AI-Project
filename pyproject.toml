[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-placement-ga-ma"
version = "1.0.0"
description = "Obstacle-aware wireless sensor placement with genetic and memetic algorithms"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5", "matplotlib==3.10.8"]

[project.scripts]
wsn = "wsn.cli:main"

[tool.setuptools.packages.find]
include = ["wsn*"]
